services:
  api:
    environment:
      AI_PROVIDER_MODE: local
      AI_API_URL: http://ollama:11434/v1/chat/completions
      AI_API_KEY: ""
      AI_MODEL: ${LOCAL_AI_MODEL:-qwen3:8b}
      AI_TIMEOUT_MS: 120000
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
